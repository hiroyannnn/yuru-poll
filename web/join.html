<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゆるアンケート 参加</title>
<style>
  :root { --bg: #14161c; --fg: #f4f4f6; --muted: #9aa0ad; --bar: #4f8cff; --bar-bg: #262a35; --accent: #ffb454; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; line-height: 1.35; }
  .hint { color: var(--muted); font-size: .95rem; margin-bottom: 16px; }
  .hint code { color: var(--fg); }
  form { display: flex; gap: 8px; }
  input { flex: 1; font-size: 1.1rem; padding: 12px; border-radius: 8px; border: 1px solid #3a3f4d; background: #1d2029; color: var(--fg); min-width: 0; }
  button { font-size: 1.1rem; padding: 12px 18px; border-radius: 8px; border: 0; background: var(--bar); color: #fff; }
  button:disabled { opacity: .5; }
  #result { margin-top: 20px; }
  .interp { color: var(--muted); margin-bottom: 8px; }
  .interp b { color: var(--fg); }
  .choice { margin: 8px 0; }
  .choice .head { display: flex; justify-content: space-between; margin-bottom: 3px; }
  .track { height: 18px; background: var(--bar-bg); border-radius: 5px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--bar); transition: width .4s ease; }
  .top .fill { background: var(--accent); }
  .error { color: #ff7b7b; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1 id="question">読み込み中…</h1>
  <div class="hint" id="hint">選択肢は選ばなくて OK。「たぶんA」「Bはないわ」「うーん迷う」みたいに自由にどうぞ。同じ人の最新の発言で上書きされます。</div>
  <form id="form">
    <input id="comment" type="text" autocomplete="off" placeholder="ひとこと" maxlength="200" required>
    <button id="send" type="submit">送る</button>
  </form>
  <div class="error" id="error"></div>
  <div id="result"></div>
</main>
<script>
  const KEY = 'yuru-poll-participant-id';
  let participantId = null;
  try { participantId = localStorage.getItem(KEY); } catch (e) {}
  if (!participantId) {
    participantId = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    try { localStorage.setItem(KEY, participantId); } catch (e) {}
  }
  let poll = null;

  async function loadPoll() {
    const res = await fetch('/api/poll');
    poll = await res.json();
    document.getElementById('question').textContent = poll.question;
    const labels = poll.choices.filter((c) => c.key !== 'none').map((c) => c.label).join(' / ');
    document.getElementById('hint').innerHTML = `選択肢: <code>${esc(labels)}</code><br>選ばなくて OK。「たぶんA」「Bはないわ」「うーん迷う」みたいに自由にどうぞ。あなたの最新の発言で上書きされます。`;
  }

  document.getElementById('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const input = document.getElementById('comment');
    const button = document.getElementById('send');
    const text = input.value.trim();
    if (!text) return;
    button.disabled = true;
    document.getElementById('error').textContent = '';
    try {
      const res = await fetch('/api/comment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ participant_id: participantId, comment: text }),
      });
      const j = await res.json();
      if (!res.ok) throw new Error(j.error || res.statusText);
      showResult(text, j.judgement);
      input.value = '';
    } catch (e) {
      document.getElementById('error').textContent = '送れませんでした: ' + e.message;
    } finally {
      button.disabled = false;
      input.focus();
    }
  });

  function showResult(text, judgement) {
    const box = document.getElementById('result');
    const top = judgement.choice;
    let html = `<div class="interp">「<b>${esc(text)}</b>」はこう解釈されました:</div>`;
    for (const c of poll.choices) {
      const p = judgement.probabilities[c.key] || 0;
      html += `<div class="choice ${c.key === top ? 'top' : ''}"><div class="head"><span>${esc(c.label)}</span><span>${Math.round(p * 100)}%</span></div>
        <div class="track"><div class="fill" style="width:${p * 100}%"></div></div></div>`;
    }
    box.innerHTML = html;
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

  loadPoll();
</script>
</body>
</html>
